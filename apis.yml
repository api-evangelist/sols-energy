description: SOLS Energy is Malaysia's leading residential and commercial solar energy company, on a
  mission to make green energy a basic human right. It has completed more than 8,900 solar installations
  across Malaysia spanning residential (Green Homes), commercial (Green Business), and off-grid indigenous
  community projects (Green Impact), and also offers EV charging (ChargeSingh) and a Solar Academy
  apprenticeship program. The company is a portfolio company of 500 Global. As of this enrichment pass
  SOLS Energy publishes a consumer marketing website (blog, FAQ, contact, privacy and terms pages) but
  no public developer platform, API, or developer documentation.
